pr: 3
entries:
  - category: config
    text: >-
      Added the experimental GDN prefill switch VLLM_ASCEND_GDN_POOL_IO.
      It defaults to off. Setting it to 1 enables indexed source/destination
      state-pool I/O for eligible packed BF16 prefill batches when the indexed
      operator is installed. Native pool reads prepared running slots while all
      temporal copies are retained, including checkpoint saves and alignment
      migrations. Older kernels and unsupported layouts keep the legacy prefill.
  - category: config
    text: >-
      Added the experimental GDN pool switch VLLM_ASCEND_GDN_POOL_LAYOUT_FUSION.
      It defaults to off. Setting it to 1 together with GDN_POOL_IO enables
      per-prefill metadata reuse and shape-gated Q/K/V layout preparation for
      eligible BF16 inputs. Unsupported shapes and layouts retain the original
      indexed pool path. Graph capture retains the original pool preparation.
  - category: dependency
    text: >-
      Documented a reproducible build of the optional indexed GDN pool operator
      from sgl-kernel-npu PR 970 at commit a967b3c, including the CANN 9.2 and
      Python 3.12 build inputs and wheel/library hashes.
  - category: bugfix
    text: >-
      GDN AscendC launch failures now raise an error instead of falling back to
      another prefill after the destination pool may have been partially written.
